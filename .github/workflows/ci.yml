name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test deps
        run: |
          pip install -e .
          pip install pytest pillow
      - name: Syntax checks
        run: |
          python -c "import ast; [ast.parse(open(f, encoding='utf-8').read()) for f in ('backtest/engine.py', 'backtest/voice_event_engine.py', 'signal_parser/parser.py')]; print('syntax OK')"
      - name: Run all tests
        run: python -m pytest tests/ -q --tb=long
      - name: CLI smoke (parser entry, real exit code)
        if: always()
        run: python -m signal_parser --help
