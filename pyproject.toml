[project]
name = "signal-vision-backtest"
version = "0.2.5"
description = "AI-vision parsing of Discord trading signals + event-driven backtest on 1m OHLC with configurable intrabar path assumption"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests"]

[project.optional-dependencies]
vision = ["requests"]
fetch = ["pillow"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["backtest*", "fetch*", "signal_parser*"]
exclude = ["tests*", "prompts*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
